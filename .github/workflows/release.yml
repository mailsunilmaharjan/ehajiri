name: Build & Release eHajiri

on:
  push:
    tags:
      - 'v*.*.*'          # triggers on: git tag v1.2.3 && git push --tags

permissions:
  contents: write         # needed to create GitHub Releases and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest   # must be Windows — Squirrel/Velopack is Windows-only

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install frontend + Electron dependencies ────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build the Vite React frontend ──────────────────────────────────
      - name: Build frontend (Vite)
        run: npm run build

      # ── 5. Install server-side dependencies (Express, pg, etc.) ───────────
      - name: Install server dependencies
        working-directory: ./server
        run: npm ci
        # If server/package.json doesn't exist yet, this step will fail —
        # see the README section "Splitting server deps" for how to set it up.

      # ── 6. Package with Electron Forge ────────────────────────────────────
      #    Produces: out/make/squirrel.windows/x64/
      #      ├── eHajiri-Setup.exe          (installer)
      #      ├── RELEASES                   (Squirrel manifest)
      #      └── eHajiri-<version>-full.nupkg
      - name: Package with Electron Forge
        run: npm run make
        env:
          APP_VERSION: ${{ github.ref_name }}   # e.g. "v1.2.3" from the tag

      # ── 7. Install the vpk CLI ─────────────────────────────────────────────
      - name: Install vpk CLI
        run: npm install -g vpk

      # ── 8. Convert Forge output to Velopack release bundle ────────────────
      #    vpk pack reads the Squirrel RELEASES + nupkg and writes a Velopack
      #    release directory (contains: *-full.nupkg, RELEASES, Setup.exe).
      - name: Pack with vpk
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          vpk pack `
            --packId      eHajiri `
            --packVersion $version `
            --packDir     out/make/squirrel.windows/x64 `
            --outputDir   releases `
            --icon        electron/icon.ico
        shell: pwsh

      # ── 9. Upload release artifacts to GitHub Releases ────────────────────
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name:     eHajiri ${{ github.ref_name }}
          draft:    false
          prerelease: false
          generate_release_notes: true
          files: |
            releases/**/*.nupkg
            releases/RELEASES
            releases/eHajiri-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
