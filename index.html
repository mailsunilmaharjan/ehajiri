<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>eHajiri TMS — हाजिरी व्यवस्थापन प्रणाली</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a56db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eHajiri">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root">
    <!-- shown until the app has loaded; React replaces it -->
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff">
      <img src="/icons/ehajiri-logo.png" alt="eHajiri" style="width:min(240px,60vw);height:auto;animation:ehBoot 1.3s ease-in-out infinite">
    </div>
    <style>@keyframes ehBoot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.05)}}</style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
