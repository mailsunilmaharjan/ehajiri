<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eHajiri</title>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#1f2937}
  .box{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
  .logo{width:72px;height:72px;border-radius:18px;background:#1a56db;color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  h1{font-size:19px;margin:0 0 8px} p{font-size:14px;color:#6b7280;margin:0 0 22px;line-height:1.5;max-width:320px}
  button{background:#1a56db;color:#fff;border:0;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="logo">EH</div>
  <h1>No connection</h1>
  <p>eHajiri needs the internet to load. Check your connection and try again.<br>इन्टरनेट जडान जाँच्नुहोस्।</p>
  <button onclick="location.href='https://attend.zkattendance.com'">Try again / फेरि प्रयास</button>
</div>
</body>
</html>
